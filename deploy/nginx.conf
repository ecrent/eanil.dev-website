server {
    listen 80;
    server_name eanil.dev www.eanil.dev;
    # Redirect HTTP to HTTPS once SSL is set up (certbot will update this)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name eanil.dev www.eanil.dev;

    # SSL certs (certbot fills these in)
    ssl_certificate     /etc/letsencrypt/live/eanil.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eanil.dev/privkey.pem;

    # Static site
    root /var/www/eanil.dev;
    index index.html;

    # --- billing-api: Swagger UI ---
    location /swagger-ui {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- billing-api: OpenAPI spec ---
    location /api-docs {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- billing-api: actual API endpoints ---
    location /api/ {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Static site (Vue SPA fallback) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
